<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - NepalJobs</title>

    <link rel="stylesheet" href="seeker.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <h2>NepalJobs</h2>
    </div>

    <ul class="menu">

        <li>
            <a href="dashboard.html">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="jobs.html">
                <i class="fas fa-search"></i>
                <span>Find Jobs</span>
            </a>
        </li>

        <li>
            <a href="application.html">
                <i class="fas fa-file-alt"></i>
                <span>My Applications</span>
            </a>
        </li>

        <li class="active">
            <a href="profile.html">
                <i class="fas fa-user"></i>
                <span>My Profile</span>
            </a>
        </li>

        <li>
            <a href="settings.html">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </li>

        <li>
            <a href="../login.html"
               onclick="logoutUser(event)">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>

</div>


<div class="main-content">

    <div class="topbar">

        <h1>My Profile</h1>

        <div class="profile">

            <i class="fas fa-user-circle"></i>

            <span id="topName">
                Job Seeker
            </span>

        </div>

    </div>


    <section class="table-section">

        <h2>Profile Information</h2>

        <form id="profileForm">

            <label>Full Name</label>

            <input
                type="text"
                id="profileName"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="profileEmail"
                readonly
            >


            <label>Password</label>

            <input
                type="password"
                id="profilePassword"
                required
            >


            <button type="submit">
                <i class="fas fa-save"></i>
                Save Changes
            </button>

        </form>

    </section>

</div>


<script>

const loggedInUser =
    JSON.parse(
        localStorage.getItem("loggedInUser")
    );


if (!loggedInUser) {

    window.location.href =
        "../login.html";

}


if (
    loggedInUser &&
    loggedInUser.role !== "jobseeker"
) {

    alert("Access denied.");

    window.location.href =
        "../login.html";

}


const profileForm =
    document.getElementById("profileForm");

const nameInput =
    document.getElementById("profileName");

const emailInput =
    document.getElementById("profileEmail");

const passwordInput =
    document.getElementById("profilePassword");

const topName =
    document.getElementById("topName");


if (loggedInUser) {

    nameInput.value =
        loggedInUser.name || "";

    emailInput.value =
        loggedInUser.email || "";

    passwordInput.value =
        loggedInUser.password || "";

    topName.textContent =
        loggedInUser.name || "Job Seeker";

}


profileForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const users =
            JSON.parse(
                localStorage.getItem("nepalJobsUsers")
            ) || [];


        const userIndex =
            users.findIndex(function(user) {

                return (
                    user.email.toLowerCase() ===
                    loggedInUser.email.toLowerCase()
                );

            });


        if (userIndex === -1) {

            alert("User account not found.");

            return;

        }


        users[userIndex].name =
            nameInput.value.trim();

        users[userIndex].password =
            passwordInput.value;


        localStorage.setItem(
            "nepalJobsUsers",
            JSON.stringify(users)
        );


        loggedInUser.name =
            nameInput.value.trim();

        loggedInUser.password =
            passwordInput.value;


        localStorage.setItem(
            "loggedInUser",
            JSON.stringify(loggedInUser)
        );


        topName.textContent =
            loggedInUser.name;


        alert(
            "Profile updated successfully."
        );

    }
);


function logoutUser(event) {

    event.preventDefault();

    localStorage.removeItem(
        "loggedInUser"
    );

    window.location.href =
        "../login.html";

}

</script>

</body>

</html>
