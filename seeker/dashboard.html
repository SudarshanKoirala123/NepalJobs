<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Seeker Dashboard - NepalJobs</title>

    <link rel="stylesheet" href="seeker.css">

   
</head>


<body>


<!-- ========================================
     SIDEBAR
     ======================================== -->

<div class="sidebar">

    <div class="logo">
        <h2>NepalJobs</h2>
    </div>


    <ul class="menu">

        <li class="active">

            <a href="dashboard.html">

                <i class="fas fa-home"></i>

                <span>Dashboard</span>

            </a>

        </li>


        <li>

            <a href="jobs.html">

                <i class="fas fa-search"></i>

                <span>Find Jobs</span>

            </a>

        </li>


        <li>

            <a href="application.html">

                <i class="fas fa-file-alt"></i>

                <span>My Applications</span>

            </a>

        </li>


        <li>

            <a href="profile.html">

                <i class="fas fa-user"></i>

                <span>My Profile</span>

            </a>

        </li>


        <li>

            <a href="settings.html">

                <i class="fas fa-cog"></i>

                <span>Settings</span>

            </a>

        </li>


        <li>

            <a href="../login.html"
               onclick="logoutUser(event)">

                <i class="fas fa-sign-out-alt"></i>

                <span>Logout</span>

            </a>

        </li>

    </ul>

</div>



<!-- ========================================
     MAIN CONTENT
     ======================================== -->

<div class="main-content">


    <!-- TOPBAR -->

    <div class="topbar">

        <h1>

            Welcome,
            <span id="userName">
                Job Seeker
            </span>

        </h1>


        <div class="profile">

            <i class="fas fa-user-circle"></i>

            <span id="profileName">
                Job Seeker
            </span>

        </div>

    </div>



    <!-- ========================================
         STATISTICS
         ======================================== -->

    <section class="cards">


        <div class="card">

            <i class="fas fa-briefcase"></i>

            <h2 id="availableJobs">
                0
            </h2>

            <p>
                Available Jobs
            </p>

        </div>



        <div class="card">

            <i class="fas fa-file-alt"></i>

            <h2 id="appliedJobs">
                0
            </h2>

            <p>
                Applied Jobs
            </p>

        </div>



        <div class="card">

            <i class="fas fa-bookmark"></i>

            <h2 id="savedJobs">
                0
            </h2>

            <p>
                Saved Jobs
            </p>

        </div>



        <div class="card">

            <i class="fas fa-check-circle"></i>

            <h2 id="selectedJobs">
                0
            </h2>

            <p>
                Selected Jobs
            </p>

        </div>


    </section>



    <!-- ========================================
         RECOMMENDED JOBS
         ======================================== -->

    <section class="table-section">


        <h2>
            Recommended Jobs
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        Job Title
                    </th>

                    <th>
                        Company
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="recommendedJobs">

                <!-- Jobs appear here -->

            </tbody>

        </table>


    </section>


</div>






</body>

</html>
