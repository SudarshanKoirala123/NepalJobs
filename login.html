<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - NepalJobs</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>
        Welcome Back
    </h1>

    <p>
        Login to your NepalJobs account
    </p>


    <form
        class="login-form"
        id="loginForm"
        action="backend/login.php"
        method="POST"
    >

        <input
            class="email"
            id="loginEmail"
            name="email"
            type="email"
            placeholder="Email Address"
            required
        >


        <input
            class="password"
            id="loginPassword"
            name="password"
            type="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p class="register-link">

        Don't have an account?

        <a href="register.html">
            Register Now
        </a>

    </p>


    <p style="margin-top:20px;">

        <a href="index.html">
            ⬅ Back to Home
        </a>

    </p>

</div>

</body>

</html>
